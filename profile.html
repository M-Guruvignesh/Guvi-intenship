<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | GUVI Internship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 class="mb-0">My Profile</h2>
              <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>

            <div id="profileAlert" class="alert d-none" role="alert"></div>

            <div class="row g-3">
              <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" class="form-control" maxlength="100">
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" readonly>
              </div>
              <div class="col-md-4">
                <label for="age" class="form-label">Age</label>
                <input id="age" type="number" class="form-control" min="1" max="120">
              </div>
              <div class="col-md-4">
                <label for="dob" class="form-label">Date of Birth</label>
                <input id="dob" type="date" class="form-control">
              </div>
              <div class="col-md-4">
                <label for="contact" class="form-label">Contact</label>
                <input id="contact" type="tel" class="form-control" maxlength="20">
              </div>
            </div>

            <button id="updateBtn" class="btn btn-success mt-4 w-100">Update Profile</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/profile.js?v=10"></script>
</body>
</html>

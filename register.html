<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | GUVI Internship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h2 class="mb-2 text-center">Create an Account</h2>
            <p class="text-muted text-center mb-4">Join our Community!</p>

            <div id="registerAlert" class="alert d-none" role="alert"></div>

            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input id="name" type="text" class="form-control" placeholder="Full Name" maxlength="100">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" type="email" class="form-control" placeholder="email@example.com">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control" placeholder="Password" minlength="8">
            </div>

            <div class="mb-4">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input id="confirmPassword" type="password" class="form-control" placeholder="Confirm Password">
            </div>

            <button id="registerBtn" class="btn btn-primary w-100">Register</button>
            <p class="mt-3 mb-0 text-center">
              Already have an account? <a href="./login.html">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
